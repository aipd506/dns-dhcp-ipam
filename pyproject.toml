[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-dhcp-ipam"
version = "0.1.0"
description = "IPv4 and IPv6 CIDR subnetting calculator, overlapping conflict detector, stateful DHCP lease tracker, and RFC 1035 compliant BIND DNS zone file generator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "aipd506" }
]
keywords = ["ipam", "subnetting", "cidr", "dhcp", "dns", "zone-generator", "ipv6", "networking"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
ipamcore = "ipamcore.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ipamcore*"]
